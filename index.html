<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Að eða Af? Málfræðileikur</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titleScreen">
    <h1>Að eða Af?</h1>
    <p>Veldu rétt orð í eyðuna áður en tíminn rennur út!</p>
    <button id="startBtn" onclick="startGame()">▶️ Spila</button>
    <br><br>
    <h2>🏆 Besti tími: <span id="menuHighscore">--</span>s</h2>
  </div>

  <div id="pauseOverlay">
    <h2>⏸ Pása</h2>
    <button onclick="resumeGame()">▶️ Halda áfram</button>
    <button onclick="goToTitle()">🏠HEIM</button>
  </div>

  <canvas id="confetti"></canvas>

  <div id="gameContainer">
    <h1>Að eða Af?</h1>

    <div id="game">
      <div id="questionBox">
        <div id="levelLabel">📘 Level <span id="level">1</span></div>
        <div id="sentence"></div>
        <div id="choices">
          <button class="choiceBtn" onclick="checkAnswer('að')">að</button>
          <button class="choiceBtn" onclick="checkAnswer('af')">af</button>
        </div>
        <div id="feedback"></div>
        <div id="explanation"></div>
      </div>

      <div id="info">
        ❤️ Líf: <span id="lives">3</span>
        |
        ⏱ Tími: <span id="timer">60</span>s
        <br><br>
        🏆 Besti tími: <span id="highscore">--</span>s
        <br>
        <button onclick="pauseGame()">⏸ PÁSA</button>
        <button onclick="restartGame()">🔁 BYRJA AFTUR</button>
        <button onclick="goToTitle()">🏠HEIM</button>
      </div>
    </div>
  </div>

  <audio id="correctSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
  </audio>

  <audio id="wrongSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
  </audio>

  <audio id="winSound">
    <source src="https://actions.google.com/sounds/v1/crowds/large_crowd_cheer.ogg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
